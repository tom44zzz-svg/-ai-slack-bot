<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1220px; height:1240px; }
  body { font-family:'IPAGothic',sans-serif; background:#0f2136; color:#eaf2f8; position:relative; overflow:hidden; }
  .band { position:absolute; left:0; right:0; top:0; height:14px; background:#3fc1e0; }
  .wrap { padding:70px 70px 0; }
  .who { font-size:24px; color:#3fc1e0; letter-spacing:6px; font-weight:bold; }
  .nm { font-size:64px; font-weight:bold; margin-top:12px; letter-spacing:2px; }
  .nm small { font-size:22px; color:#9fb3c4; font-weight:normal; letter-spacing:3px; margin-left:16px; }
  .copy { margin-top:54px; font-size:78px; font-weight:bold; line-height:1.2; }
  .copy .o { color:#ff9b42; }
  .sub { margin-top:26px; font-size:36px; color:#bfe9f5; font-weight:bold; line-height:1.4; }
  .chips { margin-top:38px; display:flex; gap:16px; }
  .chip { background:#16304a; border:3px solid #3fc1e0; border-radius:12px; padding:14px 26px; font-size:28px; font-weight:bold; color:#bfe9f5; }
  .chip b { color:#fff; }
  .slides { position:absolute; left:70px; right:70px; bottom:210px; display:flex; gap:14px; }
  .sl { flex:1; height:200px; border-radius:10px; background:#fbf8f2; position:relative; overflow:hidden; display:flex; flex-direction:column; }
  .sl .num { position:absolute; left:8px; top:8px; font-size:16px; font-family:monospace; color:#0f2136; background:#3fc1e0; border-radius:5px; padding:1px 8px; }
  .sl .top { padding:38px 12px 8px; font-size:17px; font-weight:bold; color:#241d12; line-height:1.35; }
  .sl .mid { flex:1; margin:0 12px 12px; border-radius:6px; }
  .cov { background:linear-gradient(150deg,#6e241d,#b8492f 60%,#d97b40); }
  .cov .top { color:#fff; font-size:20px; text-shadow:0 1px 3px rgba(0,0,0,.5); }
  .ph1 { background:linear-gradient(150deg,#7d2b22,#c4553a 55%,#e08a4e); }
  .ph2 { background:#efe6d4; border:2px dashed #c3b697; }
  .cta { background:#0f2a22; } .cta .top { color:#c9f7e4; } .cta .mid { background:#16483a; }
  .ft { position:absolute; left:0; right:0; bottom:0; height:170px; background:#123a52; border-top:4px solid #3fc1e0;
        display:flex; align-items:center; justify-content:space-between; padding:0 70px; }
  .ft .l { font-size:38px; font-weight:bold; color:#8ff0c8; }
  .ft .l small { display:block; font-size:22px; color:#9fb3c4; font-weight:normal; margin-top:8px; }
  .ft .r { text-align:right; font-size:24px; color:#9fb3c4; line-height:1.6; }
  .ft .r b { color:#ff9b42; font-size:40px; font-family:monospace; }
</style></head>
<body>
  <div class="band"></div>
  <div class="wrap">
    <div class="who">SNS CONTENT DESIGN</div>
    <div class="nm">投稿設計室<small>山形・米沢｜全国対応</small></div>
    <div class="copy">ネタを送るだけ。<br><span class="o">保存される投稿</span>を一式納品</div>
    <div class="sub">構成 → デザイン → 投稿文＋#まで。<br>感覚ではなく「型」で作ります</div>
    <div class="chips">
      <div class="chip">フォーマット <b>21種</b></div>
      <div class="chip">制作ルール <b>14項目</b></div>
      <div class="chip">納品前チェック <b>17項目</b></div>
    </div>
  </div>
  <div class="slides">
    <div class="sl cov"><div class="num">1</div><div class="top">米沢牛、部位で選ぶと世界が変わる</div><div class="mid"></div></div>
    <div class="sl"><div class="num">2</div><div class="top">いつも同じ部位、頼んでいませんか？</div><div class="mid ph2"></div></div>
    <div class="sl"><div class="num">3</div><div class="top">① サーロイン</div><div class="mid ph1"></div></div>
    <div class="sl"><div class="num">4</div><div class="top">② ミスジ</div><div class="mid ph1"></div></div>
    <div class="sl cta"><div class="num">7</div><div class="top">まとめ｜迷ったらこの順で</div><div class="mid"></div></div>
  </div>
  <div class="ft">
    <div class="l">初回サンプル1本 無料<small>タイトル3案＋構成案まで。合わなければそこで終わりでOK</small></div>
    <div class="r">構成のみ <b>2,000</b>円〜<br>まるごと制作 <b>5,000</b>円〜</div>
  </div>
</body></html>
