<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<style>
  /* パレット: 白基調 × ネイビー / ゴールド / ブルー（2026-09-05 本人指定・全図解共通） */
  :root{
    --bg:#f5f7fb; --panel:#ffffff; --line:#d7dee9;
    --navy:#14213d; --navy-2:#2b3a5c; --ink:#1c2534; --muted:#5b6b82; --faint:#8a97aa;
    --blue:#1f5fbf; --blue-tint:#e9f0fb;
    --gold:#c9a227; --gold-dk:#8f6f12; --gold-tint:#fbf4dc;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1280px; }
  body { font-family:'IPAGothic',sans-serif; background:var(--bg); color:var(--ink); padding:28px 36px 26px; }

  .hd { display:flex; align-items:flex-start; gap:18px; }
  .hd .l { flex:1; }
  .title { font-size:31px; font-weight:bold; line-height:1.25; color:var(--navy); }
  .title .ac { color:var(--blue); }
  .sub { font-size:15px; color:var(--muted); margin-top:6px; line-height:1.5; }
  .period { font-size:12.5px; color:var(--faint); margin-top:6px; font-family:monospace; }

  .stats { flex:0 0 auto; display:flex; gap:10px; }
  .st { background:var(--panel); border:1.5px solid var(--line); border-radius:10px; padding:9px 14px; text-align:center; min-width:96px; }
  .st .v { font-family:monospace; font-size:24px; font-weight:bold; color:var(--navy); line-height:1.1; }
  .st .k { font-size:11px; color:var(--muted); margin-top:4px; }

  .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:16px; }
  .panel { background:var(--panel); border:1.5px solid var(--line); border-top-width:4px; border-radius:12px; padding:13px 16px; }
  .panel h3 { font-size:15.5px; margin-bottom:8px; display:flex; align-items:center; gap:8px; color:var(--navy); }
  .panel h3 .n { font-family:monospace; font-size:12px; border-radius:5px; padding:1px 8px; color:#fff; }
  .panel ul { list-style:none; }
  .panel li { font-size:13.5px; color:var(--ink); line-height:1.55; padding:4px 0 4px 16px; position:relative; }
  .panel li::before { content:"▸"; position:absolute; left:0; color:var(--faint); }
  .panel li b { color:var(--navy); }
  .panel li code { font-family:monospace; font-size:12.5px; background:var(--blue-tint); padding:0 5px; border-radius:3px; color:var(--navy-2); }

  .did     { border-top-color:var(--blue); }  .did h3 .n     { background:var(--blue); }
  .built   { border-top-color:var(--navy); }  .built h3 .n   { background:var(--navy); }
  .decided { border-top-color:var(--gold); }  .decided h3 .n { background:var(--gold); }
  .decided li::before { content:"⚖"; color:var(--gold-dk); }
  .next    { border-top-color:var(--gold-dk); background:var(--gold-tint); } .next h3 .n { background:var(--gold-dk); }
  .next li::before { content:"→"; color:var(--gold-dk); }

  .foot { margin-top:14px; display:flex; align-items:center; gap:12px; }
  .foot .one { flex:1; background:var(--panel); border:1.5px solid var(--line); border-left:5px solid var(--gold); border-radius:9px;
               padding:10px 14px; font-size:15px; color:var(--ink); line-height:1.5; }
  .foot .one b { color:var(--navy); }
  .foot .meta { font-size:11.5px; color:var(--faint); text-align:right; line-height:1.6; }
</style></head>
<body>
  <div class="hd">
    <div class="l">
      <div class="title">{{title}}</div>
      <div class="sub">{{subtitle}}</div>
      <div class="period">{{period}}</div>
    </div>
    <div class="stats">
      <div class="st"><div class="v">{{stat_commits}}</div><div class="k">コミット</div></div>
      <div class="st"><div class="v">{{stat_files}}</div><div class="k">変更ファイル</div></div>
      <div class="st"><div class="v">{{stat_lines}}</div><div class="k">追加 / 削除</div></div>
    </div>
  </div>

  <div class="grid">
    <div class="panel did"><h3><span class="n">01</span>やったこと</h3><ul>{{did}}</ul></div>
    <div class="panel built"><h3><span class="n">02</span>作ったもの・仕様</h3><ul>{{built}}</ul></div>
    <div class="panel decided"><h3><span class="n">03</span>決めたこと（理由つき）</h3><ul>{{decided}}</ul></div>
    <div class="panel next"><h3><span class="n">04</span>未完了・次の一手</h3><ul>{{next}}</ul></div>
  </div>

  <div class="foot">
    <div class="one">{{oneliner}}</div>
    <div class="meta">{{footer}}</div>
  </div>
</body></html>
